name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Debug APK + OTA Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Read version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          # OTA 版本号 = package.json版本 + 第4位 run_number
          # 确保每次构建的 OTA bundle 版本号都 > APK 内置 version_build，触发更新
          OTA_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "OTA_VERSION=$OTA_VERSION" >> $GITHUB_OUTPUT
          echo "OTA version: $OTA_VERSION (APK built-in: $BASE_VERSION)"

      # 同步 versionName 到 build.gradle，确保 APK 报告正确版本号
      - name: Sync version to Android
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(echo "$VERSION" | sed 's/\.//g')
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "Android versionCode: ${VERSION_CODE}, versionName: ${VERSION}"
          grep -E 'version(Code|Name)' android/app/build.gradle

      # === OTA Bundle: 打包 web 资源为 zip，上传到 GitHub Release ===
      # manifest 端点会直接查询 GitHub Release API 获取最新 bundle
      - name: Create OTA bundle
        id: bundle
        run: |
          cd dist && zip -r ../bundle.zip . && cd ..
          CHECKSUM=$(sha256sum bundle.zip | awk '{print $1}')
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Bundle size: $(du -h bundle.zip | awk '{print $1}')"
          echo "SHA256: $CHECKSUM"

      - name: Upload OTA bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-v${{ steps.version.outputs.OTA_VERSION }}
          name: OTA Bundle v${{ steps.version.outputs.OTA_VERSION }}
          files: bundle.zip
          body: |
            OTA update for version ${{ steps.version.outputs.OTA_VERSION }}

            Base version: ${{ steps.version.outputs.BASE_VERSION }}
            Build #${{ github.run_number }} | Commit ${{ github.sha }}

            SHA256: ${{ steps.bundle.outputs.CHECKSUM }}
          prerelease: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === Android APK 构建 ===
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-agent-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
