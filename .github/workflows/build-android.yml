name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Debug APK + OTA Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Read version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # === OTA Bundle: 打包 web 资源为 zip，上传到 GitHub Release ===
      # App 启动时通过 @capgo/capacitor-updater 检查并下载新 bundle
      - name: Create OTA bundle
        run: |
          cd dist && zip -r ../bundle.zip . && cd ..
          echo "CHECKSUM=$(sha256sum bundle.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "Bundle size: $(du -h bundle.zip | awk '{print $1}')"
          echo "SHA256: $(sha256sum bundle.zip | awk '{print $1}')"
        id: bundle

      - name: Upload OTA bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-v${{ steps.version.outputs.VERSION }}
          name: OTA Bundle v${{ steps.version.outputs.VERSION }}
          files: bundle.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OTA manifest
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OTA_PUBLISH_TOKEN }}" \
            -d "{
              \"version\": \"${{ steps.version.outputs.VERSION }}\",
              \"url\": \"https://github.com/${{ github.repository }}/releases/download/ota-v${{ steps.version.outputs.VERSION }}/bundle.zip\",
              \"checksum\": \"${{ steps.bundle.outputs.CHECKSUM }}\",
              \"message\": \"OTA update ${{ steps.version.outputs.VERSION }}\"
            }" \
            https://wealth-agent.pages.dev/api/ota/publish
        continue-on-error: true

      # === Android APK 构建 ===
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-agent-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
