name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支同时只有一个 release 在跑，新 push 取消旧的
# 短时间多次 push 不会产生多个并发构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Bump version locally
        id: version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          Write-Output "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "TAG_NAME=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "New version: $v (tag: v$v)"

      - name: Build frontend
        run: npm run build

      # 使用 --publish never 构建，latest.yml 应该自动生成
      # 如果没有生成，后面的 artifacts 步骤会手动创建
      - name: Build Electron installer
        run: |
          npx electron-builder --win --x64 --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: List and verify release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $dir = Get-Item release -ErrorAction Stop
          $files = Get-ChildItem -Path release -File
          Write-Output "Files in $($dir.FullName):"
          $files | ForEach-Object { Write-Output "  $($_.Name)  $([int]($_.Length / 1MB)) MB" }
          $setupExe = ($files | Where-Object { $_.Name -like "*-setup.exe" } | Select-Object -First 1).FullName
          $blockmap = ($files | Where-Object { $_.Name -like "*.blockmap" } | Select-Object -First 1).FullName
          $latestYml = ($files | Where-Object { $_.Name -eq "latest.yml" } | Select-Object -First 1).FullName
          if (-not $setupExe) { throw "setup.exe not found in release/" }
          if (-not $latestYml) {
            Write-Output "WARNING: latest.yml not found, generating manually..."
            # 如果 latest.yml 没有被 electron-builder 生成，手动创建
            $version = "${{ steps.version.outputs.VERSION }}"
            $sha512 = (Get-FileHash -Algorithm SHA512 $setupExe).Hash.ToLower()
            $size = [int64](Get-Item $setupExe).Length
            $fileName = Split-Path $setupExe -Leaf
            $content = @"
version: $version
files:
  - url: $fileName
    sha512: $sha512
    size: $size
path: $fileName
sha512: $sha512
releaseDate: '$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ss.000Z' -AsUTC)'
"@
            $latestYmlPath = Join-Path $dir.FullName "latest.yml"
            Set-Content -Path $latestYmlPath -Value $content -Encoding UTF8
            $latestYml = $latestYmlPath
            Write-Output "Created latest.yml at: $latestYmlPath"
          }
          Write-Output "SETUP_EXE=$setupExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "SETUP_NAME=$(Split-Path $setupExe -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "BLOCKMAP=$blockmap" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "LATEST_YML=$latestYml" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Verification complete. Ready to publish."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-agent-setup-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ steps.artifacts.outputs.SETUP_EXE }}
            ${{ steps.artifacts.outputs.BLOCKMAP }}
            ${{ steps.artifacts.outputs.LATEST_YML }}
          if-no-files-found: error

      # 用 softprops 创建 Release 并上传三件套
      - name: Publish GitHub Release with installer assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: ${{ steps.version.outputs.VERSION }}
          files: |
            ${{ steps.artifacts.outputs.SETUP_EXE }}
            ${{ steps.artifacts.outputs.BLOCKMAP }}
            ${{ steps.artifacts.outputs.LATEST_YML }}
          body: |
            Desktop installer for version ${{ steps.version.outputs.VERSION }}

            Commit: ${{ github.sha }}
            Released from: Build & Release #${{ github.run_number }}

            **Files:**
            - `${{ steps.artifacts.outputs.SETUP_NAME }}` — Windows installer (x64 NSIS)
            - `latest.yml` — electron-updater metadata (version / sha512 / download URL)
            - `.blockmap` — binary diff metadata
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print download links
        shell: pwsh
        run: |
          Write-Output "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.TAG_NAME }}"
          Write-Output "Setup: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG_NAME }}/${{ steps.artifacts.outputs.SETUP_NAME }}"
          Write-Output "Latest.yml: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.TAG_NAME }}/latest.yml"
