name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'package.json'
  workflow_dispatch:

# 关键：同一分支同时只有一个 release 在跑，新 push 取消旧的
# 这样短时间多次 push 不会产生多个并发构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 只在本地 bump 版本号，不提交回仓库
      # 这样不会产生新 commit，不会触发 build-android.yml 重复构建
      # electron-builder 会读取 package.json 中被 bump 的版本来命名 Release
      - name: Bump version locally
        run: |
          npm version patch --no-git-tag-version
          node -e "console.log('New version:', require('./package.json').version)"

      - name: Build frontend
        run: npm run build

      - name: Build & publish Electron app
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
